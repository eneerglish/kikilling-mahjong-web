<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | My project</title>
    <style>
      /*
        画面いっぱいに広げる（2026-09-30）。

        **この docs/ はビルド出力なので、次のビルドで上書きされる。**
        同じ中身を `Assets/WebGLTemplates/KillingMahjong/index.html` に置いてあり、
        `WebGLBuildSetup.cs` がそちらを使うよう指定してある。
        ここを直してあるのは、ビルドを待たずに今の公開版で見られるようにするため。
      */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0b;
        overflow: hidden;
      }

      #unity-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        /* ドット絵なので、拡大は必ず nearest-neighbour にする */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        image-rendering: -moz-crisp-edges;

        /* 4:3 を保ったまま、入るほうの辺に合わせて最大化する */
        width: min(100vw, calc(100vh * 4 / 3));
        height: min(100vh, calc(100vw * 3 / 4));

        background: #231F20;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="800" height="600" tabindex="-1"></canvas>
    </div>

    <script src="Build/docs.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/docs.data",
        frameworkUrl: "Build/docs.framework.js",
        codeUrl: "Build/docs.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "My project",
        productVersion: "0.1.0",

        // **中身は 800x600 のまま描かせる。** 既定のままだと Unity が CSS の
        // 大きさに合わせて描画解像度を上げ、ドット絵が半端な倍率で個別に拡大されて
        // 位置ごとに太さが変わる。画面全体を1枚の絵として引き伸ばすほうが揃う。
        matchWebGLToCanvasSize: false,

        // 高DPIの画面でも 800x600 で描く
        devicePixelRatio: 1,
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
